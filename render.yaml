services:
  - type: web
    name: zero-market-sentinel
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WATCHLIST
        value: AAPL,MSFT,NVDA,GOOGL,AMZN,META,TSLA,AMD,AVGO,QCOM,TSM,ARM,PLTR,NFLX,CRM,ORCL,COIN,UBER,BABA,TCEHY,BYDDY,BIDU,JD,PDD,NIO,LI
      - key: POLL_INTERVAL_MS
        value: "2000"
      - key: MIN_CONFIDENCE
        value: "0.50"
      - key: ENABLE_HEALTH_SERVER
        value: "true"
      # Required Secrets (Only 2 keys needed for instant 1-click launch!)
      - key: FINNHUB_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      # Optional Notification Channels & Partner Integrations
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: "pNInz6obpgDQGcFmaJgB"
      - key: ENABLE_VOICE_ALERTS
        value: "true"
      - key: SENTRY_DSN
        sync: false
